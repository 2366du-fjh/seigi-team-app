<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#155e52"><title>生技課 · 人員分析 v3</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="sidebar"><a class="brand" href="#overview"><span class="brand-icon">S<span>+</span></span><div>生技課<span class="brand-sub">TEAM INSIGHT</span></div></a><div class="workspace">生產技術課 <span>工作空間</span></div><div class="nav-label">工作台</div><nav><button data-view="overview" class="active"><span>▦</span>分析總覽</button><button data-view="people"><span>♙</span>人員名冊</button><button data-view="skills"><span>▧</span>技能矩陣</button><button data-view="workload"><span>◷</span>工作負荷</button><button data-view="jobs"><span>▤</span>職務說明書</button></nav><div class="side-bottom"><div class="save-dot"></div><strong>資料儲存在此瀏覽器</strong><p>可匯出備份，隨時帶走資料。</p><button id="backup">↗ 匯出備份</button><div class="side-footer">生產技術課管理工具 <span>v3.0</span></div></div></aside>
<main><header><div class="breadcrumb">工作台 <span>/</span> <b id="crumb">分析總覽</b></div><div class="header-right"><span class="status-dot"></span> 本機工作空間 <span class="avatar">生技</span></div></header><div class="content"><div class="page-heading"><div><div class="eyebrow">PEOPLE & CAPABILITY</div><h1 id="title">讓團隊配置，一目了然<span>。</span></h1><p id="subtitle">掌握生技課的人力、技能與工作負荷，讓每一次安排更有依據。</p></div><button class="primary" id="add">＋ 新增人員</button></div>
<div class="toolbar"><div class="tabs"><button data-view="overview" class="active">總覽</button><button data-view="people">人員</button><button data-view="skills">技能</button><button data-view="workload">負荷</button><button data-view="jobs">職務</button></div><div class="tool-right"><label for="group">組別</label><select id="group"><option value="">全部組別</option></select><button class="outline" id="export">↓ 匯出 CSV</button></div></div>
<div id="view"></div><footer>以已建檔資料計算；空白技能及工時不納入平均。<span id="saved">尚無變更</span></footer></div></main>
<dialog id="editor"><form id="personForm"><div class="dialog-top"><div><div class="eyebrow">TEAM MEMBER</div><h2 id="dialogTitle">新增人員</h2></div><button type="button" class="icon-button" id="close" aria-label="關閉">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>姓名 <span>*</span><input name="name" required maxlength="30" placeholder="請輸入姓名"></label><label>職稱<input name="role" maxlength="30" placeholder="例如：副組長"></label><label>組別<select name="group"><option value="">待分組</option><option>機務組</option><option>開發組</option><option>保養組</option></select></label><label>生日<input name="birthday" type="date"></label><label>入職日<input name="startDate" type="date"></label><label>每週可用工時<input name="capacity" type="number" min="1" max="168" step="0.5" placeholder="例如：40"></label><label>本週已排工時<input name="hours" type="number" min="0" max="336" step="0.5" placeholder="尚未建檔"></label><label>主要工作內容<input name="note" maxlength="160" placeholder="負責設備、專案等"></label></div><div class="skills-label">技能熟練度 <small>1 初學 · 2 協助操作 · 3 獨立作業 · 4 指導他人</small></div><div id="skillFields" class="form-grid"></div><p class="form-hint">未評估的技能與工時請保留空白。</p><div class="dialog-actions"><button type="button" id="remove" class="danger">刪除此人員</button><button type="submit" class="primary">儲存人員</button></div></form></dialog>
<input id="importFile" type="file" accept=".json,application/json" hidden><div id="toast" role="status"></div><script src="app.js"></script></body></html>
